
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-worker-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-worker-service
  template:
    metadata:
      labels:
        app: db-worker-service
    spec:
      containers:
        - name: db-worker-service
          image: "{{ worker_image }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POSTGRES_SERVER
              value: postgres-service
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_URL
          readinessProbe:
            httpGet:
              path: /pulse
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /pulse
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: db-worker-service
  namespace: default
  labels:
    app: db-worker-service
spec:
  type: ClusterIP
  selector:
    app: db-worker-service
  ports:
    - name: http
      port: 8080
      targetPort: http
