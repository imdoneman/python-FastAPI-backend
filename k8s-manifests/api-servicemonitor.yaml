apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-service-monitor
  namespace: default
  labels:
    release: tea-house-monitoring
spec:
  namespaceSelector:
    matchNames: [default]
  selector:
    matchLabels:
      app: api-service
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
