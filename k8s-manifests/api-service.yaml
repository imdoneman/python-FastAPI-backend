apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      containers:
      - name: api-service
        image: dockeriamdoneman/api-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: RABBITMQ_URL
          value: "amqp://guest:guest@rabbitmq-service:5672//"
        # Add your database environment variables here if using external DB
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: default
spec:
  selector:
    app: api-service
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: NodePort