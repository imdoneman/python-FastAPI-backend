
---
- name: Configure EC2 and deploy Tea House API
  hosts: all
  become: true
  gather_facts: true

  vars:
    app_dir: /opt/tea-house-api
    image_tag: "{{ tea_house_image_tag | default('2.2.0') }}"
    image_name: "tea-house-api:{{ image_tag }}"
    image_archive: "/tmp/tea-house-api-{{ image_tag }}.tar"

  tasks:
    - name: Update installed packages
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true

    - name: Install Docker and required utilities
      ansible.builtin.dnf:
        name:
          - docker
          - rsync
          - curl
        state: present

    - name: Ensure Docker is enabled and running
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Create Docker CLI plugin directory
      ansible.builtin.file:
        path: /usr/local/lib/docker/cli-plugins
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install Docker Compose plugin
      ansible.builtin.get_url:
        url: >-
          https://github.com/docker/compose/releases/latest/download/docker-compose-linux-{{
          'x86_64' if ansible_architecture == 'x86_64'
          else 'aarch64' if ansible_architecture == 'aarch64'
          else ansible_architecture }}
        dest: /usr/local/lib/docker/cli-plugins/docker-compose
        owner: root
        group: root
        mode: "0755"

    - name: Verify Docker Compose installation
      ansible.builtin.command:
        cmd: docker compose version
      changed_when: false

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy Docker Compose configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker-compose.yaml"
        dest: "{{ app_dir }}/docker-compose.yaml"
        owner: root
        group: root
        mode: "0644"

    - name: Configure application image tag
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.env"
        content: |
          TEA_HOUSE_IMAGE={{ image_name }}
        owner: root
        group: root
        mode: "0600"

    - name: Verify transferred image archive exists
      ansible.builtin.stat:
        path: "{{ image_archive }}"
      register: image_file

    - name: Stop if the image archive is missing
      ansible.builtin.assert:
        that:
          - image_file.stat.exists
          - image_file.stat.isreg
          - image_file.stat.size | int > 0
        fail_msg: "Expected Docker image archive was not transferred: {{ image_archive }}"

    - name: Load the pre-built application image
      ansible.builtin.command:
        cmd: "docker load -i {{ image_archive }}"
      register: image_load
      changed_when: "'Loaded image:' in image_load.stdout or 'Loaded image ID:' in image_load.stdout"

    - name: Deploy API and PostgreSQL stack without rebuilding or pulling
      ansible.builtin.command:
        cmd: docker compose up -d --no-build --pull never --remove-orphans
        chdir: "{{ app_dir }}"
      register: compose_deploy
      changed_when: >-
        'Creating' in compose_deploy.stdout or
        'Starting' in compose_deploy.stdout or
        'Recreating' in compose_deploy.stdout or
        'Created' in compose_deploy.stdout or
        'Started' in compose_deploy.stdout

    - name: Wait for API health endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:8000/pulse
        method: GET
        status_code: 200
        return_content: true
      register: health_check
      retries: 18
      delay: 5
      until:
        - health_check.status == 200
        - health_check.json.status | default('') == 'online'

    - name: Display deployment health
      ansible.builtin.debug:
        msg:
          - "Deployed image: {{ image_name }}"
          - "Health response: {{ health_check.json }}"

    - name: Remove transferred image archive
      ansible.builtin.file:
        path: "{{ image_archive }}"
        state: absent
