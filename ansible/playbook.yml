---
- name: Configure Production Target and Deploy Tea House API Stack
  hosts: all
  become: true
  gather_facts: true

  tasks:
    # 1. Ensure all installed packages on our system are up to date
    - name: Ensure all installed packages on our system are up to date
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: yes

    # 2. Install core system utilities
    - name: Install underlying package management dependencies
      ansible.builtin.dnf:
        name:
          - yum-utils
          - device-mapper-persistent-data
          - lvm2
        state: present

    # 3. Install core Docker Engine via native AL2023 repositories
    - name: Use default Amazon repository to download and install Docker
      ansible.builtin.dnf:
        name: docker
        state: present

    # 4. Establish plugin directory structure for Docker subsystems
    - name: Create system plugin directory matrix for CLI components
      ansible.builtin.file:
        path: /usr/libexec/docker/cli-plugins
        state: directory
        mode: '0755'

    # 5. Install Docker Compose as a native Engine CLI plugin
    - name: Download current version of docker compose plugin and make executable
      ansible.builtin.get_url:
        url: "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-{{ ansible_architecture }}"
        dest: /usr/libexec/docker/cli-plugins/docker-compose
        mode: '0755'
        owner: root
        group: root
      notify: Restart Docker Daemon

    # 6. Start and Enable Docker Service at startup
    - name: Ensure Docker background management engine is enabled and active
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    # 7. Establish runtime directory structure
    - name: Create working directory on host file matrix
      ansible.builtin.file:
        path: /opt/tea-house-api
        state: directory
        mode: '0755'

    # 8. Ship ONLY the orchestration file (No raw python source code needed!)
    - name: Copy docker-compose configuration definition to host
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker-compose.yaml"
        dest: /opt/tea-house-api/docker-compose.yaml
        mode: '0644'

    # 9. Dynamically generate the secure database variables
    - name: Create secure .env file for Docker Compose runtime
      ansible.builtin.copy:
        dest: /opt/tea-house-api/.env
        mode: '0600'
        content: |
          DB_USER={{ target_db_user }}
          DB_PASSWORD={{ target_db_password }}
          DB_NAME={{ target_db_name }}

    # 10. Pull the Docker Hub artifact and boot the stack
    - name: Pull remote artifact and boot container stack
      ansible.builtin.shell:
        cmd: "docker compose pull && docker compose up -d"
        chdir: /opt/tea-house-api/
      environment:
        DOCKER_REGISTRY_USER: "{{ docker_registry_user }}"
        IMAGE_TAG: "{{ docker_image_tag }}"

  handlers:
    - name: Restart Docker Daemon
      ansible.builtin.systemd:
        name: docker
        state: restarted