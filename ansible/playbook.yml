---
- name: Configure Production Target and Tea House Api Stack
  hosts: all
  become: true
  gather_facts: true

  tasks:
    # 1. Ensure all installed packages on our system are up to date
    - name: Ensure all installed packages on our system are up to date
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: yes

    # 2. Install core system utilities
    - name: Install underlying package management dependencies and rsync
      ansible.builtin.dnf:
        name:
          - yum-utils
          - device-mapper-persistent-data
          - lvm2
          - rsync
        state: present

    # 3. Install core Docker Engine via native AL2023 repositories
    - name: Use default Amazon repository to download and install Docker
      ansible.builtin.dnf:
        name: docker
        state: present

    # 4. Establish plugin directory structure for Docker subsystems
    - name: Create system plugin directory matrix for CLI components
      ansible.builtin.file:
        path: /usr/libexec/docker/cli-plugins
        state: directory
        mode: '0755'

    # 5. Install Docker Compose as a native Engine CLI plugin
    - name: Download current version of docker compose plugin and make executable
      ansible.builtin.get_url:
        url: "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-{{ ansible_architecture }}"
        dest: /usr/libexec/docker/cli-plugins/docker-compose
        mode: '0755'
        owner: root
        group: root
      notify: Restart Docker Daemon

    # 6. Start and Enable Docker Service at startup
    - name: Ensure Docker background management engine is enabled and active
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    # 7. Ship your verified codebase directly to the production instance node
    - name: Create working directory on host file matrix
      ansible.builtin.file:
        path: /opt/tea-house-api
        state: directory
        mode: '0755'

    - name: Synchronize project codebase components to the cloud server
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../"
        dest: /opt/tea-house-api/
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=.venv"
          - "--exclude=__pycache__"
          - "--exclude=terraform"
          - "--exclude=ansible"

    # 8. 🔥 FIX: Pre-compile image layers by disabling Buildkit to bypass the Buildx requirements entirely
    - name: Pre-build Docker Compose image dependencies natively
      ansible.builtin.shell:
        cmd: docker compose build --pull
        chdir: /opt/tea-house-api/
      environment:
        DOCKER_BUILDKIT: "0"
        COMPOSE_DOCKER_CLI_BUILD: "0"

    # 9. Launch the container stack in detached mode instantly
    - name: Launch active runtime container stack in background
      ansible.builtin.shell:
        cmd: docker compose up -d
        chdir: /opt/tea-house-api/

  handlers:
    - name: Restart Docker Daemon
      ansible.builtin.systemd:
        name: docker
        state: restarted