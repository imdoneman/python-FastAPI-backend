
---
- name: Configure EC2 and deploy Tea House API
  hosts: all
  become: true
  gather_facts: true

  vars:
    app_dir: /opt/tea-house-api
    image_tag: "{{ docker_image_tag }}"
    registry_user: "{{ docker_registry_user }}"
    image_name: "{{ registry_user }}/{{ app_name }}:{{ image_tag }}"

  tasks:
    - name: Install Docker and required utilities
      ansible.builtin.dnf:
        name:
          - docker
        state: present

    - name: Ensure Docker is enabled and running
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Create Docker Compose plugin directory
      ansible.builtin.file:
        path: /usr/local/lib/docker/cli-plugins
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install Docker Compose plugin
      ansible.builtin.get_url:
        url: >-
          https://github.com/docker/compose/releases/latest/download/docker-compose-linux-{{
          'x86_64' if ansible_architecture == 'x86_64'
          else 'aarch64' if ansible_architecture == 'aarch64'
          else ansible_architecture }}
        dest: /usr/local/lib/docker/cli-plugins/docker-compose
        owner: root
        group: root
        mode: "0755"

    - name: Verify Docker Compose installation
      ansible.builtin.command:
        cmd: docker compose version
      changed_when: false

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy Docker Compose configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker-compose.yaml"
        dest: "{{ app_dir }}/docker-compose.yaml"
        owner: root
        group: root
        mode: "0644"

    - name: Create Docker Compose environment file
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.env"
        owner: root
        group: root
        mode: "0600"
        content: |
          APP_NAME={{ app_name }}
          DOCKER_REGISTRY_USER={{ registry_user }}
          IMAGE_TAG={{ image_tag }}
          DB_USER={{ target_db_user }}
          DB_PASSWORD={{ target_db_password }}
          DB_NAME={{ target_db_name }}
      no_log: true

    - name: Validate Docker Compose configuration
      ansible.builtin.command:
        cmd: docker compose config -q
        chdir: "{{ app_dir }}"
      changed_when: false
      no_log: true

    - name: Pull application and database images
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: "{{ app_dir }}"
      register: compose_pull
      changed_when: >-
        'Downloaded newer image' in compose_pull.stdout or
        'Pull complete' in compose_pull.stdout

    - name: Deploy API and PostgreSQL stack
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans
        chdir: "{{ app_dir }}"
      register: compose_deploy
      changed_when: >-
        'Creating' in compose_deploy.stdout or
        'Starting' in compose_deploy.stdout or
        'Recreating' in compose_deploy.stdout or
        'Created' in compose_deploy.stdout or
        'Started' in compose_deploy.stdout

    - name: Wait for API health endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:8000/pulse
        method: GET
        status_code: 200
        return_content: true
      register: health_check
      retries: 18
      delay: 5
      until:
        - health_check.status == 200
        - health_check.json.status | default('') == 'online'

    - name: Display deployment health
      ansible.builtin.debug:
        msg:
          - "Deployed image: {{ image_name }}"
          - "Health response: {{ health_check.json }}"
