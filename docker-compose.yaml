
services:
  web:
    image: ${TEA_HOUSE_IMAGE:?TEA_HOUSE_IMAGE must be set}
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://tea_user:tea_password@db:5432/tea_db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tea_user
      POSTGRES_PASSWORD: tea_password
      POSTGRES_DB: tea_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tea_user -d tea_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
